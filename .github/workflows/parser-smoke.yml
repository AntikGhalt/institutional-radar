name: Calendar parser live smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/calendars.py'
      - 'tests/test_calendars.py'
      - '.github/workflows/parser-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch real calendars without changing snapshots
        run: python -m src.parser_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-smoke
          path: |
            output/parser-smoke.json
            output/parser-fixtures/
