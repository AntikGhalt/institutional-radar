name: 3 - Validate AI review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Review pull request number
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && startsWith(github.event.pull_request.head.ref, 'claude/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never execute the pull request branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data-only review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python -m src.accept_review
