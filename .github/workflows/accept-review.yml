name: 3 - Validate and accept AI review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Review pull request number
        required: true
        type: number
      dry_run:
        description: Validate without merging
        type: boolean
        default: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: radar-data
  cancel-in-progress: false
jobs:
  accept:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && startsWith(github.event.pull_request.head.ref, 'claude/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SECURITY: only trusted main; never checkout or run the PR branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data-only PR and merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.ENABLE_AUTO_ACCEPT != 'true' }}
        run: |
          export TRUSTED_MAIN_SHA="$(git rev-parse HEAD)"
          python -m src.accept_review
