name: 2 - Build digest and optionally deliver
on:
  workflow_dispatch:
    inputs:
      date:
        description: Sunday run ID (YYYY-MM-DD)
        type: string
      send:
        description: Request production delivery (not for future Sundays)
        type: boolean
        default: false
      test_email:
        description: Send a labelled test using an existing reviewed week
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * 0'
      timezone: Europe/Rome
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: radar-data
  cancel-in-progress: false
jobs:
  finalize:
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RADAR_SCHEDULED: ${{ github.event_name == 'schedule' }}
      RUN_DATE: ${{ inputs.date }}
    steps:
      - name: Validate manual mode
        if: github.event_name == 'workflow_dispatch' && ((inputs.send == true && inputs.test_email == true) || ((inputs.send == true || inputs.test_email == true) && vars.ENABLE_EMAIL != 'true'))
        run: exit 1
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build preview only
        if: inputs.test_email != true && !(vars.ENABLE_EMAIL == 'true' && (github.event_name == 'schedule' || inputs.send == true))
        run: |
          args=()
          if [[ -n "$RUN_DATE" ]]; then args+=(--date "$RUN_DATE"); fi
          python -m src.radar finalize "${args[@]}"
      - name: Build and reserve production digest
        if: vars.ENABLE_EMAIL == 'true' && (github.event_name == 'schedule' || inputs.send == true)
        env:
          ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
          RADAR_DELIVERY_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          args=()
          if [[ -n "$RUN_DATE" ]]; then args+=(--date "$RUN_DATE"); fi
          python -m src.radar finalize "${args[@]}" --reserve
          git config user.name 'institutional-radar[bot]'
          git config user.email 'institutional-radar[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve institutional digest delivery'
            git push
          fi
      - name: Deliver reserved digest
        if: vars.ENABLE_EMAIL == 'true' && (github.event_name == 'schedule' || inputs.send == true)
        env:
          ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
          RADAR_DELIVERY_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          args=()
          if [[ -n "$RUN_DATE" ]]; then args+=(--date "$RUN_DATE"); fi
          python -m src.radar finalize "${args[@]}" --send
      - name: Send labelled test (no production state)
        if: github.event_name == 'workflow_dispatch' && inputs.test_email == true && vars.ENABLE_EMAIL == 'true'
        env:
          ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          args=()
          if [[ -n "$RUN_DATE" ]]; then args+=(--date "$RUN_DATE"); fi
          python -m src.radar finalize "${args[@]}" --test-email
      - name: Record final state
        if: always() && steps.checkout.conclusion != 'failure'
        run: |
          if [[ ! -d .git ]]; then exit 0; fi
          git config user.name 'institutional-radar[bot]'
          git config user.email 'institutional-radar[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Record weekly operational checks and delivery state'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institutional-radar-output
          path: output/
          if-no-files-found: ignore
          retention-days: 14
